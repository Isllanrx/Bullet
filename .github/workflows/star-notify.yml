name: Star Notification

on:
  watch:
    types: [started]

permissions: {}

jobs:
  notify:
    name: Notify Discord on Star
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_STAR_WEBHOOK }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_AVATAR: ${{ github.event.sender.avatar_url }}
          SENDER_URL: ${{ github.event.sender.html_url }}
          REPO_NAME: ${{ github.repository }}
          REPO_URL: ${{ github.event.repository.html_url }}
          STARS_COUNT: ${{ github.event.repository.stargazers_count }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Secret DISCORD_STAR_WEBHOOK is not set. Skipping notification."
            exit 0
          fi

          python3 -c 'import textwrap; exec(textwrap.dedent("""
              import json
              import os
              import urllib.request
              from datetime import datetime, timezone

              webhook_url = os.environ["DISCORD_WEBHOOK"]
              user = os.environ.get("SENDER_LOGIN", "alguém")
              user_url = os.environ.get("SENDER_URL", "")
              avatar = os.environ.get("SENDER_AVATAR", "")
              repo = os.environ.get("REPO_NAME", "Bullet")
              repo_url = os.environ.get("REPO_URL", "")
              stars = os.environ.get("STARS_COUNT", "1")

              payload = {
                  "username": "Bullet Stars",
                  "avatar_url": "https://raw.githubusercontent.com/Isllanrx/Bullet/main/assets/bullet.png",
                  "embeds": [
                      {
                          "title": "⭐ Nova estrela recebida!",
                          "description": f"O usuário [**{user}**]({user_url}) acabou de marcar o repositório [**{repo}**]({repo_url}) com uma estrela!",
                          "color": 16766720,
                          "fields": [
                              {
                                  "name": "⭐ Total de Estrelas",
                                  "value": f"**{stars}**",
                                  "inline": True
                              },
                              {
                                  "name": "👤 Quem avaliou",
                                  "value": f"[{user}]({user_url})",
                                  "inline": True
                              }
                          ],
                          "author": {
                              "name": user,
                              "url": user_url,
                              "icon_url": avatar
                          },
                          "footer": {
                              "text": "Bullet • League of Legends Skin Changer",
                              "icon_url": "https://raw.githubusercontent.com/Isllanrx/Bullet/main/assets/bullet.png"
                          },
                          "timestamp": datetime.now(timezone.utc).isoformat()
                      }
                  ]
              }

              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(
                  webhook_url,
                  data=data,
                  headers={"Content-Type": "application/json", "User-Agent": "Bullet-Star-Notifier"}
              )
              with urllib.request.urlopen(req) as resp:
                  print(f"Discord notified successfully (status: {resp.status})")
          """))'
