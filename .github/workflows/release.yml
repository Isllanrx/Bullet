name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Next version from the last release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git tag --points-at "$SHA" | grep -Eq '^v[0-9]+\.[0-9]+'; then
            echo "$SHA is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
          latest=${latest:-v0.0}
          IFS=. read -r major minor _ <<<"${latest#v}"
          breaking=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[].labels[].name] | index("breaking") != null')
          if [[ "$breaking" == true ]]; then
            next="$((major + 1)).0"
          else
            next="$major.$((minor + 1))"
          fi
          floor=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "bullet-app") | .version' | cut -d. -f1,2)
          [[ "$floor" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::bad workspace version $floor"; exit 1; }
          version=$(printf '%s\n%s\n' "$next" "$floor" | sort -V | tail -n 1)
          tag="v$version"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; raise the workspace version or remove the stale tag"
            exit 1
          fi
          echo "Releasing $tag (previous $latest, breaking=$breaking, floor $floor)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build installer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      BULLET_GITHUB_CLIENT_ID: ${{ vars.BULLET_GITHUB_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the GitHub OAuth client ID used by StarGate
        shell: pwsh
        run: |
          if (-not $env:BULLET_GITHUB_CLIENT_ID) {
            Write-Host "::error::Set the BULLET_GITHUB_CLIENT_ID repository variable to the Client ID of the GitHub OAuth App with Device Flow enabled"
            exit 1
          }

      - name: GitHub App token for bullet_ltk
        id: ltk-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.BULLET_BOT_APP_ID }}
          private-key: ${{ secrets.BULLET_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bullet_ltk
          permission-contents: read

      - name: Checkout private LTK companion repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/bullet_ltk
          path: .private/bullet_ltk
          token: ${{ steps.ltk-token.outputs.token }}
          persist-credentials: false

      - name: Link private LTF bridge module
        shell: pwsh
        run: |
          if (-not (Test-Path .private/bullet_ltk/ltf/mod.rs)) {
            Write-Host "::error::Private LTK checkout is missing ltf/mod.rs"
            exit 1
          }
          Remove-Item -Recurse -Force crates/bullet-inject/src/ltf
          Copy-Item -Recurse .private/bullet_ltk/ltf crates/bullet-inject/src/ltf
          $now = [DateTime]::UtcNow
          Get-ChildItem -Recurse -File crates/bullet-inject/src/ltf | ForEach-Object { $_.LastWriteTimeUtc = $now }

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Stamp the release version (cargo xtask set-version)
        env:
          BULLET_LTK_DIR: .private/bullet_ltk
        run: cargo xtask set-version "$env:VERSION"

      - name: Quality gate (cargo xtask check)
        run: cargo xtask check

      - name: Verify private LTK workspace
        shell: pwsh
        working-directory: .private/bullet_ltk
        run: |
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Build the release binary and bridge tools (cargo xtask package)
        env:
          BULLET_LTK_DIR: .private/bullet_ltk
          BULLET_REQUIRE_LTK: "1"
        run: cargo xtask package

      - name: Build installer around that binary (cargo xtask installer --prebuilt)
        run: cargo xtask installer --prebuilt

      - name: Checksums
        shell: pwsh
        run: |
          $name = "Bullet-Setup-$env:VERSION-x64.exe"
          $hash = (Get-FileHash "dist/installer/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash *$name" | Set-Content -NoNewline -Encoding ascii dist/installer/SHA256SUMS
          Get-Content dist/installer/SHA256SUMS

      - name: Build the signing tool without the key
        shell: pwsh
        run: cargo build --package xtask

      - name: Sign the checksums for in-app updates
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) {
            "::error::RELEASE_SIGNING_KEY is not set; a release without SHA256SUMS.sig cannot update installed copies"
            exit 1
          }
          cargo xtask sign-sums dist/installer/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "sign-sums failed" }

      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/installer/Bullet-Setup-${{ env.VERSION }}-x64.exe

      - name: Attach the provenance bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE "dist/installer/Bullet-Setup-$env:VERSION-x64.exe.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist/installer/Bullet-Setup-${{ env.VERSION }}-x64.exe
            dist/installer/Bullet-Setup-${{ env.VERSION }}-x64.exe.sigstore.json
            dist/installer/SHA256SUMS
            dist/installer/SHA256SUMS.sig

  publish:
    name: Publish pre-release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" out/*.exe out/*.sigstore.json out/SHA256SUMS* \
            --target "$SHA" --prerelease --generate-notes --title "Bullet $TAG"
