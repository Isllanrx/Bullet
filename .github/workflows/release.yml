name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Next version from the last release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if git tag --points-at "$SHA" | grep -Eq '^v[0-9]+\.[0-9]+'; then
            echo "$SHA is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -n 1)
          latest=${latest:-v0.0}
          IFS=. read -r major minor _ <<<"${latest#v}"
          breaking=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[].labels[].name] | index("breaking") != null')
          if [[ "$breaking" == true ]]; then
            next="$((major + 1)).0"
          else
            next="$major.$((minor + 1))"
          fi
          floor=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "bullet-app") | .version' | cut -d. -f1,2)
          [[ "$floor" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "::error::bad workspace version $floor"; exit 1; }
          version=$(printf '%s\n%s\n' "$next" "$floor" | sort -V | tail -n 1)
          tag="v$version"
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists; raise the workspace version or remove the stale tag"
            exit 1
          fi
          echo "Releasing $tag (previous $latest, breaking=$breaking, floor $floor)"
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "release=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build installer
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      HAS_CERTUM: ${{ secrets.CERTUM_OTP_URI != '' && vars.CERTUM_CERT_SHA1 != '' }}
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      SIGNING: ${{ (secrets.CERTUM_OTP_URI != '' && vars.CERTUM_CERT_SHA1 != '') || secrets.SIGNPATH_API_TOKEN != '' }}
      BULLET_GITHUB_CLIENT_ID: ${{ vars.BULLET_GITHUB_CLIENT_ID }}
      CERTUM_CERT_SHA1: ${{ vars.CERTUM_CERT_SHA1 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require the GitHub OAuth client ID used by StarGate
        shell: pwsh
        run: |
          if (-not $env:BULLET_GITHUB_CLIENT_ID) {
            Write-Host "::error::Set the BULLET_GITHUB_CLIENT_ID repository variable to the Client ID of the GitHub OAuth App with Device Flow enabled"
            exit 1
          }

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - name: Stamp the release version (cargo xtask set-version)
        run: cargo xtask set-version "$env:VERSION"

      - name: Quality gate (cargo xtask check)
        run: cargo xtask check

      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }

      - name: Build the release binary and LTF bridge tools (cargo xtask package)
        run: cargo xtask package

      - name: Setup Certum SimplySign
        if: env.HAS_CERTUM == 'true'
        shell: pwsh
        env:
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = Join-Path $env:RUNNER_TEMP 'SimplySignDesktop.msi'
          $expectedSha = '6309e8b46f1f4e786288e777aef515a2c30d885165b71a21191e9941badebd6b'
          Invoke-WebRequest -Uri 'https://files.certum.eu/software/SimplySignDesktop/Windows/9.4.5.95/SimplySignDesktop-9.4.5.95-64-bit-en.msi' -OutFile $msi
          $actualSha = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) { throw "SimplySign MSI SHA-256 mismatch: $actualSha" }
          $proc = Start-Process msiexec.exe -ArgumentList '/i', $msi, '/qn', '/norestart' -Wait -PassThru
          if ($proc.ExitCode -notin @(0, 3010)) { throw "SimplySign MSI install failed with exit code $($proc.ExitCode)" }
          $ssd = 'C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe'
          if (-not (Test-Path $ssd)) { throw 'SimplySignDesktop.exe not found after install' }
          $asm = [System.Reflection.Assembly]::LoadFile($ssd)
          $cfg = $asm.GetType('CloudService.Config')
          $flags = [System.Reflection.BindingFlags]::Public -bor [System.Reflection.BindingFlags]::Static
          $cfg.GetMethod('setRememberPINinCSP', $flags).Invoke($null, @($true))
          $cfg.GetMethod('setShowLoginDialogOnStart', $flags).Invoke($null, @($false))
          $cfg.GetMethod('setShowLoginDialogOnAppRequest', $flags).Invoke($null, @($false))
          $cd = $asm.GetType('CloudService.CloudData')
          $totp = $asm.GetType('CloudService.TotpCalc')
          $tmpOtp = Join-Path $env:RUNNER_TEMP 'ssd-otp.txt'
          try {
            [System.IO.File]::WriteAllText($tmpOtp, $env:CERTUM_OTP_URI.Trim())
            if (-not $cd.GetMethod('parseOtpAuthSeed', $flags).Invoke($null, @($tmpOtp))) {
              throw 'Failed to parse CERTUM_OTP_URI'
            }
          } finally {
            if (Test-Path $tmpOtp) { Remove-Item $tmpOtp -Force }
          }
          $qr = $cfg.GetField('otpAuthData', $flags).GetValue($null)
          $qt = $qr.GetType()
          $user = $qt.GetField('userLogin').GetValue($qr)
          $seed = $qt.GetField('userSeed').GetValue($qr)
          $alg = $qt.GetField('alg').GetValue($qr)
          $digits = $qt.GetField('digits').GetValue($qr)
          $period = [int]$qt.GetField('period').GetValue($qr)
          if ($period -gt 0 -and ($period - ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() % $period)) -lt 5) {
            Start-Sleep -Seconds 6
          }
          $otp = $totp.GetMethod('qrGetOTP', $flags).Invoke($null, @($seed, $alg, $digits, $period))
          Start-Process -FilePath $ssd -ArgumentList '/autologin', $user, $otp
          $deadline = (Get-Date).AddSeconds(60)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            $cert = Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $env:CERTUM_CERT_SHA1 -and $_.HasPrivateKey }
            if ($cert) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "Certum certificate $($env:CERTUM_CERT_SHA1) with private key did not appear in Cert:\CurrentUser\My" }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool.exe not found' }
          "SIGNTOOL=$signtool" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign LTF bridge tools (Certum)
        if: env.HAS_CERTUM == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /sha1 $env:CERTUM_CERT_SHA1 /fd SHA256 /tr http://time.certum.pl /td SHA256 /d 'Bullet LTF Launcher' /du 'https://github.com/Isllanrx/Bullet' dist/tools/bullet_launcher.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:SIGNTOOL sign /sha1 $env:CERTUM_CERT_SHA1 /fd SHA256 /tr http://time.certum.pl /td SHA256 /d 'Bullet LTF Bridge DLL' /du 'https://github.com/Isllanrx/Bullet' dist/tools/bullet_bridge.dll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign bullet.exe (Certum)
        if: env.HAS_CERTUM == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /sha1 $env:CERTUM_CERT_SHA1 /fd SHA256 /tr http://time.certum.pl /td SHA256 /d 'Bullet' /du 'https://github.com/Isllanrx/Bullet' dist/bullet.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - id: unsigned-exe
        if: env.HAS_CERTUM != 'true' && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-bullet-exe-${{ env.VERSION }}
          if-no-files-found: error
          path: dist/bullet.exe

      - name: Sign bullet.exe (SignPath)
        if: env.HAS_CERTUM != 'true' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist

      - name: Build installer around that binary (cargo xtask installer --prebuilt)
        run: cargo xtask installer --prebuilt

      - name: Sign the installer (Certum)
        if: env.HAS_CERTUM == 'true'
        shell: pwsh
        run: |
          & $env:SIGNTOOL sign /sha1 $env:CERTUM_CERT_SHA1 /fd SHA256 /tr http://time.certum.pl /td SHA256 /d 'Bullet Installer' /du 'https://github.com/Isllanrx/Bullet' "dist/installer/Bullet-Setup-$env:VERSION-x64.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stop Certum SimplySign
        if: always() && env.HAS_CERTUM == 'true'
        shell: pwsh
        run: Stop-Process -Name SimplySignDesktop -Force -ErrorAction SilentlyContinue

      - id: unsigned-setup
        if: env.HAS_CERTUM != 'true' && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-setup-${{ env.VERSION }}
          if-no-files-found: error
          path: dist/installer/Bullet-Setup-${{ env.VERSION }}-x64.exe

      - name: Sign the installer (SignPath)
        if: env.HAS_CERTUM != 'true' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/installer

      - name: Verify the Authenticode signatures
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $files = @('dist/bullet.exe', "dist/installer/Bullet-Setup-$env:VERSION-x64.exe")
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            "{0}: {1} {2}" -f $file, $signature.Status, $signature.SignerCertificate.Subject
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed" }
          }

      - name: Checksums
        shell: pwsh
        run: |
          $name = "Bullet-Setup-$env:VERSION-x64.exe"
          $hash = (Get-FileHash "dist/installer/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash *$name" | Set-Content -NoNewline -Encoding ascii dist/installer/SHA256SUMS
          Get-Content dist/installer/SHA256SUMS

      - name: Build the signing tool without the key
        shell: pwsh
        run: cargo build --package xtask

      - name: Sign the checksums for in-app updates
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if (-not $env:RELEASE_SIGNING_KEY) {
            "::error::RELEASE_SIGNING_KEY is not set; a release without SHA256SUMS.sig cannot update installed copies"
            exit 1
          }
          cargo xtask sign-sums dist/installer/SHA256SUMS
          if ($LASTEXITCODE -ne 0) { throw "sign-sums failed" }

      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/installer/Bullet-Setup-${{ env.VERSION }}-x64.exe

      - name: Attach the provenance bundle
        shell: pwsh
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: Copy-Item $env:BUNDLE "dist/installer/Bullet-Setup-$env:VERSION-x64.exe.sigstore.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bullet-${{ env.VERSION }}
          if-no-files-found: error
          path: |
            dist/installer/Bullet-Setup-${{ env.VERSION }}-x64.exe
            dist/installer/Bullet-Setup-${{ env.VERSION }}-x64.exe.sigstore.json
            dist/installer/SHA256SUMS
            dist/installer/SHA256SUMS.sig

  publish:
    name: Publish pre-release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          gh release create "$TAG" out/*.exe out/*.sigstore.json out/SHA256SUMS* \
            --target "$SHA" --prerelease --generate-notes --title "Bullet $TAG"
