version: 2
updates:
  # Pinned action SHAs only stay current if something bumps them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Only version bumps of existing crates; a new dependency still needs a written justification.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /relay-worker
    schedule:
      interval: monthly
    groups:
      relay:
        patterns: ['*']
